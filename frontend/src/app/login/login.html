<div class="login-page">
  <!-- Panel de bienvenida -->
  <section class="hero" aria-hidden="true">
    <img class="brand-wordmark" src="brand-wordmark.png" alt="" />

    <svg class="hero-wave" viewBox="0 0 160 800" preserveAspectRatio="none">
      <path class="wave-yellow" d="M60 0 C 140 160, 0 300, 70 460 S 120 700, 40 800 L160 800 L160 0 Z" />
      <path class="wave-fuchsia" d="M85 0 C 160 170, 25 310, 95 470 S 140 700, 70 800 L160 800 L160 0 Z" />
      <path class="wave-surface" d="M110 0 C 175 180, 50 320, 120 480 S 160 700, 100 800 L160 800 L160 0 Z" />
    </svg>
  </section>

  <!-- Formulario -->
  <section class="form-side">
    <div class="pattern" aria-hidden="true"></div>

    <div class="login-card">
      <div class="login-header">
        <h1>{{ 'Iniciar Sesión' | t }}</h1>
        <span class="title-underline"></span>
        <img class="logo-image" src="logo.jpg" alt="Tienda Leiva" />
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group">
          <label for="email" class="sr-only">{{ 'Correo electrónico' | t }}</label>
          <div class="input-wrap" [class.invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="M3 7l9 6 9-6"></path>
            </svg>
            <input
              id="email"
              type="email"
              formControlName="email"
              autocomplete="username"
              [attr.placeholder]="'Correo electrónico' | t"
              class="form-control"
            />
          </div>
          <div class="error-message" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">{{ 'El correo electrónico es obligatorio' | t }}</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">{{ 'Ingresa un correo válido (ej. nombre@dominio.com)' | t }}</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="sr-only">{{ 'Contraseña' | t }}</label>
          <div class="input-wrap" [class.invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="10" rx="2"></rect>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              [attr.placeholder]="'Contraseña' | t"
              class="form-control"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="(showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña') | t"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"></path>
              </svg>
            </button>
          </div>
          <div class="error-message" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">{{ 'La contraseña es obligatoria' | t }}</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">{{ 'La contraseña debe tener al menos 6 caracteres' | t }}</span>
          </div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" formControlName="remember" />
            <span>{{ 'Recordarme' | t }}</span>
          </label>
          <a href="#" class="forgot-password">{{ '¿Olvidaste tu contraseña?' | t }}</a>
        </div>

        <div class="error-message global" *ngIf="errorMessage" role="alert">
          {{ errorMessage | t }}
        </div>

        <button type="submit" class="btn-login" [disabled]="isLoading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"></path>
          </svg>
          <span *ngIf="!isLoading">{{ 'Iniciar Sesión' | t }}</span>
          <span *ngIf="isLoading">{{ 'Cargando...' | t }}</span>
        </button>
      </form>
    </div>
  </section>
</div>
